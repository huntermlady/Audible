[project]
name = "audible-ai"
version = "0.1.0"
description = "Audible AI core: fact sheets, grounding, providers, weekly reports, eval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audible-contracts",
    "anthropic>=0.60",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyarrow>=17",
]

[project.scripts]
audible-ai = "audible_ai.cli:main"

[tool.uv.sources]
audible-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audible_ai"]
