[project]
name = "audible-pipeline"
version = "0.1.0"
description = "Audible offline data pipeline: nflverse -> aggregated Parquet/JSON"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "audible-contracts",
]

[tool.uv.sources]
audible-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audible_pipeline"]
