[project]
name = "audible-contracts"
version = "0.1.0"
description = "Audible shared contracts: generated pydantic models, fixtures generator, mock-data CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audible_contracts"]
